<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roast My GitHub</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>ROAST MY GITHUB 🔥</h1>
  <p>Powered by Jev. Judged by math. Emotionally damaged by you.</p>
  <form id="roast-form">
    <input id="username" placeholder="enter a username… if you dare" autocomplete="off" required>
    <button type="submit">ROAST ME</button>
  </form>
  <p id="status" hidden></p>
  <section id="results" hidden>
    <ol id="roast-lines"></ol>
    <h2>⚖️ Jev's verdict</h2>
    <pre id="verdict"></pre>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
